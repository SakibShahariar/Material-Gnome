# 🐱✨ Kitty Terminal Configuration

allow_remote_control yes
listen_on unix:/tmp/kitty


# ======================
# 🌈 Theme & Appearance
# ======================
background_opacity        1
hide_window_decorations   no

# ======================
# 🔤 Font Settings
# ======================
font_family               CaskaydiaCove Nerd Font
bold_font                 auto
italic_font               auto
bold_italic_font          auto
font_size                 10.0
disable_ligatures         never
map ctrl+shift+backspace  change_font_size all 0

# ======================
# 🖼 Window Layout
# ======================
remember_window_size      yes
window_border_width       2pt
window_padding_width      5
window_margin_width       10
enabled_layouts           tall,stack,grid,fat

# ======================
# 🖱 Mouse & Scrolling
# ======================
scrollback_lines          10000
wheel_scroll_multiplier   2.0
mouse_hide_wait           0.5
cursor_shape              beam
cursor_blink_interval     1
cursor_stop_blinking_after 3
cursor_trail              1
cursor_shape_unfocused    unchanged

# ======================
# ✂ Clipboard
# ======================
copy_on_select            yes
map ctrl+v                paste_from_clipboard
allow_remote_control      yes
clipboard_control         write-clipboard write-primary

# ======================
# 📑 Tab Bar
# ======================
tab_bar_edge              top
tab_bar_margin_width      20
tab_bar_style             fade
tab_fade                  0
tab_bar_align             center
bell_on_tab               "🔔 "
window_alert_on_bell yes

# Tab Title Templates
tab_title_template        "{fmt.bg.default}{fmt.fg.color241}{fmt.fg.default}{fmt.bg.color241}{fmt.fg.color3} {title} {fmt.fg.default}{fmt.bg.default}{fmt.fg.color241}{fmt.fg.default}"
active_tab_title_template "{fmt.bg.default}{fmt.fg.color4}{fmt.fg.default}{fmt.bg.color4}{fmt.fg.color233} {title} {fmt.fg.default}{fmt.bg.default}{fmt.fg.color4}{fmt.fg.default}"
active_tab_font_style     bold
inactive_tab_font_style   italic

# ======================
# ⚙️ Behavior
# ======================
enable_audio_bell         no
linux_display_server      x11
confirm_os_window_close   0
shell_integration         no-cursor
# Enhanced command completion notification
notify_on_cmd_finish invisible 10.0 command notify-send -i "terminal" -t 4000 "Kitty" "A long-running command has finished."

# ======================
# ⌨️ Key Bindings
# ======================

# Window Management
map ctrl+n                new_window
map ctrl+equal            change_font_size all +2.0
map ctrl+minus            change_font_size all -2.0
map ctrl+0                change_font_size all 0

# Layout Management
map ctrl+shift+l          next_layout

# Tab Management
map ctrl+t                new_tab
map ctrl+alt+q            close_tab
map ctrl+right            next_tab
map ctrl+left             previous_tab


# BEGIN_KITTY_THEME
# Matugen
include current-theme.conf
# END_KITTY_THEME
