# : Manager [[[

[manager]
cwd = { fg = "#ebdbb2" }

# Tab
tab_active = { fg = "#282828", bg = "#83a598", bold = true }
tab_inactive = { fg = "#a8edff", bg = "#001f26" }
tab_width = 1

# Find
find_keyword = { fg = "#fb4934", bold = true, italic = true, underline = true }
find_position = { fg = "#fb4934", bold = true, italic = true }

# Marker
marker_copied = { fg = "#d3869b", bg = "#d3869b" }
marker_cut = { fg = "#d3869b", bg = "#d3869b" }
marker_marked = { fg = "#fb4934", bg = "#fb4934" }
marker_selected = { fg = "#d3869b", bg = "#d3869b" }

# Count
count_copied = { fg = "#d5c4a1", bg = "#d3869b" }
count_cut = { fg = "#d5c4a1", bg = "#d3869b" }
count_selected = { fg = "#282828", bg = "#d3869b" }

# Border
border_symbol = "│"
border_style  = { fg = "#83a598" }

# : ]]]


# : Status [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#282828", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#83a598", fg = "#282828", bold = true }
normal_alt  = { bg = "#bfc8cb", fg = "#d5c4a1" }

# Select mode
select_main = { bg = "#b2cbd2", fg = "#1c3439", bold = true }
select_alt  = { bg = "#bfc8cb", fg = "#d5c4a1" }

# Unset mode
unset_main = { bg = "#bec5eb", fg = "#272f4d", bold = true }
unset_alt  = { bg = "#bfc8cb", fg = "#d5c4a1" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#83a598", bg = "#343a3c" }
progress_error = { fg = "#fb4934", bg = "#343a3c" }

# Permissions
permissions_t = { fg = "#b2cbd2" }
permissions_w = { fg = "#bec5eb" }
permissions_x = { fg = "#fb4934" }
permissions_r = { fg = "#dce1ff" }
permissions_s = { fg = "#a8edff" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#83a598" }
active = { fg = "#bec5eb", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#83a598" }
value = { fg = "#ebdbb2" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "#83a598", bg = "#282828" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#83a598" }
title = {}
hovered = { fg = "#d3869b", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#343a3c" }
cand = { fg = "#83a598" }
rest = { fg = "#282828" }
desc = { fg = "#ebdbb2" }
separator = " ▶ "
separator_style = { fg = "#ebdbb2" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#ebdbb2" }
run = { fg = "#ebdbb2" }
footer = { fg = "#d5c4a1", bg = "#b2cbd2" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#bec5eb" }
title_warn = { fg = "#83a598" }
title_error = { fg = "#fb4934" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000A" },
    { name = "*", is = "exec", fg = "#FFDAD6" },

    # Fallback
    { name = "*", fg = "#ebdbb2" },
    { name = "*/", fg = "#83a598" },
]

# : ]]]
