[config]

caching = true

# choices:
# [darkness, lightness, saturation, less-saturation, value, closest-to-fallback]
# prefer = ""

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = "pkill -USR2 btop || true"

[templates.cava]
input_path = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.config/cava/themes/cava'
post_hook = "pkill -USR1 cava"

[templates.clock-rs]
input_path = "~/.config/matugen/templates/clock-rs-conf.toml"
output_path = "~/.config/clock-rs/conf.toml"
post_hook = "pkill -USR1 clock-rs"

[templates.colors]
input_path = '~/.config/matugen/templates/mpv-config.conf'
output_path = '~/.config/mpv/mpv.conf'

[templates.fix]
input_path = "~/.config/matugen/templates/fix.css"
output_path = "~/.config/colors/fix.css"

[templates.gnome-shell]
input_path = '~/.config/matugen/templates/gnome-shell.css'
output_path = '~/.themes/Material-Gnome/gnome-shell/gnome-shell.css'
post_hook = "dconf write /org/gnome/shell/extensions/user-theme/name \"'default'\" && dconf write /org/gnome/shell/extensions/user-theme/name \"'Material-Gnome'\""

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk3-colors.css'
output_path = '~/.themes/Material-Gnome/gtk-3.0/colors.css'

[templates.gtk3_theme]
input_path = '~/.config/matugen/templates/gtk3-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme "Material-Gnome"'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk4-colors.css'
output_path = '~/.themes/Material-Gnome/gtk-4.0/colors.css'

[templates.gtk4_theme]
input_path = '~/.config/matugen/templates/gtk4-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = '~/Scripts/gtk-themes-reload.sh'

[templates.kew]
input_path = '~/.config/matugen/templates/kew.theme'
output_path = '~/.config/kew/themes/matugen.theme'

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/themes/Matugen.conf"
post_hook = "kitty +kitten themes --reload-in=all Matugen"

[templates.kvantum_kvconfig]
input_path = './templates/kvantum-colors.kvconfig'
output_path = '~/.config/Kvantum/matugen/matugen.kvconfig'

[templates.kvantum_svg]
input_path = './templates/kvantum-colors.svg'
output_path = '~/.config/Kvantum/matugen/matugen.svg'

[templates.lockscreen]
input_path = '~/.config/matugen/templates/clock-color.css'
output_path = '~/.config/colors/clock-color.css'

[templates.micro]
input_path = '~/.config/matugen/templates/micro-colors.micro'
output_path = '~/.config/micro/colorschemes/colors.micro'

[templates.mpv]
input_path = '~/.config/matugen/templates/mpv-uosc.conf'
output_path = '~/.config/mpv/script-opts/uosc.conf'

[templates.mpv-config]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.config/colors.json'

[templates.pop-shell]
input_path = "~/.config/matugen/templates/pop-shell.css"
output_path = "~/.config/colors/pop-shell.css"

[templates.qt5ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/colors.conf'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/colors.conf'

[templates.search-light]
input_path = "~/.config/matugen/templates/search-light.css"
output_path = "~/.config/colors/search-light.css"

