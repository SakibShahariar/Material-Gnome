[config]

caching = true

# choices:
# [darkness, lightness, saturation, less-saturation, value, closest-to-fallback]
# prefer = ""

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = "pkill -USR2 btop || true"

[templates.cava]
input_path = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.config/cava/themes/cava'
post_hook = "pkill -USR1 cava"

[templates.clock-rs]
input_path = "~/.config/matugen/templates/clock-rs-conf.toml"
output_path = "~/.config/clock-rs/conf.toml"
post_hook = "pkill -USR1 clock-rs"

[templates.colors]
input_path = '~/.config/matugen/templates/mpv-config.conf'
output_path = '~/.config/mpv/mpv.conf'

[templates.fish]
input_path = '~/.config/matugen/templates/fish.tpl'
output_path = '~/.config/fish/matugen_colors.fish'
post_hook = "fish -c 'set -U MATUGEN_RELOAD_TRIGGER (date +%s)'"

[templates.fix]
input_path = "~/.config/matugen/templates/fix.css"
output_path = "~/.config/colors/fix.css"

[templates.fresh]
input_path = "~/.config/matugen/templates/fresh.json"
output_path = "~/.config/fresh/themes/matugen.json"

[templates.gnome-shell]
input_path = '~/.config/matugen/templates/gnome-shell.css'
output_path = '~/.themes/Material-Gnome/gnome-shell/gnome-shell-stub.css'
# post_hook = "~/.config/matugen/post-hook-scripts/merge-layout.sh"

[templates.gnome-shell-active]
input_path = "~/.config/matugen/templates/gnome-active-layout.css"
output_path = "~/.themes/Material-Gnome/gnome-shell/layouts/active-layout.css"

[templates.gnome-shell-floating-capsule]
input_path = '~/.config/matugen/templates/gnome-floating-capsule.css'
output_path = '~/.themes/Material-Gnome/gnome-shell/layouts/floating-capsule.css'

[templates.gnome-shell-floating-capsule-glass]
input_path = '~/.config/matugen/templates/gnome-floating-capsule-glass.css'
output_path = '~/.themes/Material-Gnome/gnome-shell/layouts/floating-capsule-glass.css'

[templates.gnome-shell-pill-duo]
input_path = '~/.config/matugen/templates/gnome-pill-duo.css'
output_path = '~/.themes/Material-Gnome/gnome-shell/layouts/pill-duo.css'

[templates.gnome-unified-pill]
input_path = '~/.config/matugen/templates/gnome-segmented-pill.css'
output_path = '~/.themes/Material-Gnome/gnome-shell/layouts/segmented-pill.css'

[templates.gnome-unified-capsule-bottom]
input_path = '~/.config/matugen/templates/gnome-unified-capsule-bottom.css'
output_path = '~/.themes/Material-Gnome/gnome-shell/layouts/unified-capsule-bottom.css'

[templates.gnome-unified-bar]
input_path = '~/.config/matugen/templates/gnome-unified-bar.css'
output_path = '~/.themes/Material-Gnome/gnome-shell/layouts/unified-bar.css'

[templates.gnome-unified-capsule]
input_path = '~/.config/matugen/templates/gnome-unified-capsule.css'
